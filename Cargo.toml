[package]
name = "scx_cms"
version = "0.1.0"
authors = ["Jamie Black <blackjable83@gmail.com>"]
edition = "2021"
description = "A scx_simple-derived scheduler with a swappable per-task identity abstraction (PID/TGID/comm), built to carry a Count-Min Sketch wakeup-frequency tracker. https://github.com/sched-ext/scx/tree/main"
license = "GPL-2.0-only"

publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"] }
ctrlc = { version = "3", features = ["termination"] }
libbpf-rs = "=0.27.0"
log = "0.4"
scx_utils = { path = "../../../rust/scx_utils", version = "1.1.3" }
simplelog = "0.12"

[build-dependencies]
scx_cargo = { path = "../../../rust/scx_cargo", version = "1.1.3" }

[features]
enable_backtrace = []

# Not yet exercised against a live sched_ext kernel (Phase 2 VM setup is a
# separate, later step) -- disable veristat until there's a real run to
# generate baseline numbers from.
[package.metadata.veristat]
disable = true
